<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, My Love</title>
<meta name="theme-color" content="#ffc2d9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff0f5; --bg2:#ffc9dc; --ink:#4a1730; --soft:#8a4a62;
  --rose:#e63e6d; --deep:#b3124f; --paper:#fffaf5; --gold:#e9a92f; --gold2:#c98312;
  --serif:"Cormorant Garamond","Playfair Display",Georgia,serif;
  --sans:"Quicksand","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--ink);min-height:100vh;
  background:linear-gradient(180deg,var(--bg1),var(--bg2) 60%,#ffb3cf);background-attachment:fixed;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
main{position:relative;z-index:2;max-width:520px;margin:0 auto}
.page{display:none;min-height:100vh;min-height:100dvh;padding:78px 18px 48px;flex-direction:column;align-items:center;justify-content:center}
.page.active{display:flex}
.page.active[data-dir=f]{animation:inF .65s cubic-bezier(.2,.8,.2,1) both}
.page.active[data-dir=b]{animation:inB .65s cubic-bezier(.2,.8,.2,1) both}
.page.leave[data-dir=f]{animation:outF .38s ease-in both}
.page.leave[data-dir=b]{animation:outB .38s ease-in both}
@keyframes inF{from{opacity:0;transform:translateX(60px) scale(.97)}}
@keyframes inB{from{opacity:0;transform:translateX(-60px) scale(.97)}}
@keyframes outF{to{opacity:0;transform:translateX(-60px) scale(.97)}}
@keyframes outB{to{opacity:0;transform:translateX(60px) scale(.97)}}
.topbar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 10px;transition:opacity .4s}
.topbar.hide{opacity:0;pointer-events:none}
.pdots{display:flex;gap:8px}
.pdots i{width:9px;height:9px;border-radius:50%;background:rgba(179,18,79,.2);transition:.4s}
.pdots i.done{background:rgba(230,62,109,.6)}
.pdots i.now{background:var(--deep);width:26px;border-radius:9px}
.back{position:absolute;left:14px;top:calc(8px + env(safe-area-inset-top));width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.75);color:var(--deep);font-size:1.4rem;line-height:1;cursor:pointer;box-shadow:0 4px 12px -4px rgba(179,18,79,.4)}
.nav{margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:6px;animation:fadein .7s 1.2s both}
.nav.wait{visibility:hidden;animation:none}
.nav.wait.on{visibility:visible;animation:fadein .7s both}
.btn.big{font-size:1rem;padding:14px 30px}
.cover{text-align:center}
.cover .env{width:min(220px,60vw);animation:float 3s ease-in-out infinite;filter:drop-shadow(0 18px 20px rgba(179,18,79,.35))}
.cover h1{font-size:clamp(2rem,9vw,2.8rem);margin-top:18px}
.cover p{margin-top:8px;color:var(--soft);font-weight:500;font-size:.95rem}
@keyframes float{50%{transform:translateY(-10px) rotate(-2deg)}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(230,62,109,.18),0 8px 16px -6px rgba(207,31,88,.7)}}
h1,h2,.script{font-family:var(--serif);font-style:italic;font-weight:700}
:focus-visible{outline:3px solid var(--deep);outline-offset:3px;border-radius:12px}

/* hero */
.swing-box{width:min(250px,70vw);margin-top:0;background:#fff;border:3px solid #f19ab9;border-radius:16px;
  box-shadow:0 14px 30px -10px rgba(179,18,79,.35);overflow:hidden;border-top:0;border-top-left-radius:0;border-top-right-radius:0;
  animation:drop 1.1s cubic-bezier(.2,.9,.3,1.2) both}
.swing-box svg{display:block;width:100%}
.sw{transform-box:view-box;animation:swing 2.6s ease-in-out infinite alternate}
.sw.b{animation-delay:-1.3s;animation-duration:3s}
@keyframes swing{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes drop{from{transform:translateY(-120%)}to{transform:none}}
.kicker{margin-top:14px;font-size:.82rem;letter-spacing:.04em;color:var(--soft);font-weight:500}
h1{font-size:clamp(2.3rem,10.5vw,3.3rem);line-height:1.1;text-align:center;margin:8px 0 0;
  background:linear-gradient(100deg,#b3124f 20%,#ff5c8a 50%,#b3124f 80%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
h1 .cake{display:inline-block;-webkit-text-fill-color:initial;animation:bob 2.4s ease-in-out infinite}
@keyframes shine{to{background-position:-220% 0}}
@keyframes bob{50%{transform:translateY(-6px) rotate(6deg)}}

/* bouquet */
.bouquet{width:min(240px,66vw);margin-top:6px}
.stem{fill:none;stroke:#2f7a5b;stroke-width:3.4;stroke-linecap:round;stroke-dasharray:140;stroke-dashoffset:140;animation:grow 1.6s ease-out forwards}
.bloom{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .7s cubic-bezier(.2,1.6,.4,1) forwards}
.bloom>g{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
@keyframes grow{to{stroke-dashoffset:0}}
@keyframes pop{to{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* cards */
.card{width:100%;border-radius:20px;padding:22px 22px 24px;margin-top:0;text-align:center;
  background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,236,244,.78));
  border:1px solid rgba(255,255,255,.9);box-shadow:0 18px 40px -18px rgba(179,18,79,.35),inset 0 1px 0 #fff;
  backdrop-filter:blur(6px)}
.card h2{font-size:1.5rem;color:var(--deep);margin-bottom:14px}
.letter{background:var(--paper);text-align:left;border-radius:6px 20px 20px 6px;border-left:4px solid var(--deep);margin-top:0;position:relative}
.letter h2{font-size:1.3rem;margin-bottom:10px}
.letter p{font-size:.93rem;line-height:1.75;margin-bottom:12px;min-height:1.2em;font-weight:500}
.letter .caret::after{content:"";display:inline-block;width:2px;height:1em;background:var(--deep);margin-left:2px;vertical-align:-2px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.letter figure{display:flex;justify-content:center;opacity:0;transition:opacity 1s .2s;margin:6px 0 8px}
.letter figure.on,.letter .sign.on{opacity:1}
.letter figure svg{width:150px;border-radius:14px;box-shadow:0 8px 20px -10px rgba(0,0,0,.3)}
.letter figure img{width:150px;aspect-ratio:1;object-fit:cover;border-radius:14px;box-shadow:0 8px 20px -10px rgba(0,0,0,.3)}
.moment img{display:block;width:100%;aspect-ratio:240/170;object-fit:cover;border-radius:14px;border:2px solid #fff;box-shadow:0 10px 24px -12px rgba(179,18,79,.5)}
.finale .pic img{display:block;width:min(240px,72vw);aspect-ratio:240/170;object-fit:cover;border-radius:14px;border:3px solid var(--deep);box-shadow:0 14px 30px -12px rgba(179,18,79,.6)}
.sign{font-family:var(--serif);font-style:italic;font-weight:700;color:var(--deep);opacity:0;transition:opacity 1s .5s}

/* moments */
.pair{display:flex;flex-direction:column;align-items:center;gap:16px}
.moment{width:min(240px,78%)}
.moment svg{display:block;width:100%;border-radius:14px;border:2px solid #fff;box-shadow:0 10px 24px -12px rgba(179,18,79,.5)}
.moment p{font-family:var(--serif);font-style:italic;font-weight:600;font-size:.98rem;margin-top:6px;color:var(--ink)}
.moment{animation:fadein .6s both}
@keyframes fadein{from{opacity:0;transform:scale(.94)}}
.count{margin-top:14px;font-size:.84rem;color:var(--soft);font-weight:600}
.btn{margin-top:12px;font:600 .88rem var(--sans);color:#fff;border:0;cursor:pointer;padding:11px 22px;border-radius:999px;
  background:linear-gradient(180deg,#f0507d,#cf1f58);box-shadow:0 8px 16px -6px rgba(207,31,88,.7),inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:#fff;color:var(--deep);box-shadow:inset 0 0 0 1.5px var(--deep)}

/* reasons / promises */
.reason{font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.3rem;min-height:3.6em;display:flex;align-items:center;justify-content:center;padding:0 6px;transition:opacity .25s,transform .25s}
.reason.out{opacity:0;transform:translateY(8px)}
.promises{list-style:none;text-align:left}
.promises li{display:flex;gap:10px;padding:10px 2px;font-size:.88rem;font-weight:500;line-height:1.5;border-bottom:1px solid rgba(179,18,79,.14)}
.promises li:last-child{border:0}
.promises li::before{content:"♥";color:var(--rose);font-size:.75rem;margin-top:3px}

/* meter */
.meter{height:18px;border-radius:99px;background:rgba(230,62,109,.16);overflow:hidden;box-shadow:inset 0 2px 4px rgba(179,18,79,.2)}
.meter i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ff8fb1,#e63e6d,#b3124f);transition:width 2.2s cubic-bezier(.2,.8,.2,1);position:relative}
.meter.full i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);background-size:60% 100%;background-repeat:no-repeat;animation:glide 1.6s linear infinite}
@keyframes glide{from{background-position:-100% 0}to{background-position:200% 0}}
.meter-text{margin:12px 0 2px;font-size:.84rem;font-weight:600;min-height:2.6em}

/* finale */
.finale{margin-top:0;display:flex;flex-direction:column;align-items:center}
.finale .pic svg{width:min(240px,72vw);border-radius:14px;border:3px solid var(--deep);box-shadow:0 14px 30px -12px rgba(179,18,79,.6)}
.finale h2{font-size:2rem;color:var(--deep);margin-top:18px}
.dots{margin-top:26px;color:var(--rose);letter-spacing:.9em;font-size:.7rem;padding-left:.9em}
.dots span{display:inline-block;animation:bob 1.8s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.25s}.dots span:nth-child(3){animation-delay:.5s}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,40px);opacity:0;z-index:60;
  background:var(--ink);color:#fff;font-weight:600;font-size:.88rem;padding:11px 20px;border-radius:999px;transition:.35s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
@media (min-width:700px){main{max-width:560px}}
.wish{text-align:center}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.stem{stroke-dashoffset:0}.bloom{transform:none}}
</style>
</head>
<body>

<main>
  <section class="page cover active" data-dir="f" id="p0">
    <svg class="env" viewBox="0 0 200 150" aria-hidden="true"><rect x="10" y="30" width="180" height="110" rx="12" fill="#fff4f7" stroke="#e86a93" stroke-width="3"/><path d="M12 36l88 62 88-62" fill="#ffd0e0" stroke="#e86a93" stroke-width="3" stroke-linejoin="round"/><use href="#heart" x="82" y="68" width="36" height="36" style="color:#e63e6d"/></svg>
    <h1 class="script" style="-webkit-text-fill-color:initial;background:none;color:var(--deep);animation:none">I made something for you</h1>

  </section>

  <section class="page wish" id="p1">
    <div class="swing-box" id="swing" aria-hidden="true"></div>
    <p class="kicker">Today is all about you</p>

    <svg class="bouquet" id="bouquet" viewBox="0 0 200 190" role="img" aria-label="A bouquet of pinwheel flowers in a golden box"></svg>

const BGS = ['#ffd3e2','#fff1c9','#e2f3ff','#ffe0cf','#eadcff'];
function scene(i, pose, emoji){
  const bg = BGS[i % BGS.length];
  let g='';
  if(pose==='hug'){
    g = use('bear',28,42,100,110,'rotate(-7 78 97)') + use('bunny',92,42,100,110,'rotate(7 142 97)');
    g += `<text x="120" y="42" font-size="30" text-anchor="middle">${emoji}</text>`;
  } else if(pose==='rose'){
    g = use('bear',14,38) + `<path d="M104 112q8-8 12-22" stroke="#2f7a5b" stroke-width="3" fill="none" stroke-linecap="round"/><text x="118" y="92" font-size="22" text-anchor="middle">🌹</text>`
      + use('bunny',124,38) + `<text x="140" y="132" font-size="28">${emoji}</text>`;
  } else {
    g = use('bear',34,40,100,110,'rotate(10 84 95)') + use('bunny',106,40,100,110,'rotate(-10 156 95)')
      + `<text x="120" y="70" font-size="26" text-anchor="middle">${emoji}</text>`;
  }
  const dots = [[20,24],[210,30],[200,140],[26,136]].map((p,k)=>`<use href="#heart" x="${p[0]}" y="${p[1]}" width="${12+k*2}" height="${12+k*2}" style="color:#ff7aa2" opacity=".55"/>`).join('');
  return `<svg viewBox="0 0 240 170" xmlns="http://www.w3.org/2000/svg"><rect width="240" height="170" fill="${bg}"/>${dots}${g}</svg>`;
}

/* Hero swing box */
$('#swing').innerHTML = `<svg viewBox="0 0 250 130">
  <rect width="250" height="130" fill="#fff"/>
  <g class="sw" style="transform-origin:70px 0">
    <path d="M52 0V70M88 0V70" stroke="#c9a27a" stroke-width="2"/><rect x="46" y="68" width="48" height="6" rx="3" fill="#e9b56b"/>
    ${use('bunny',38,18,64,70)}
  </g>
  <g class="sw b" style="transform-origin:180px 0">
    <path d="M162 0V70M198 0V70" stroke="#c9a27a" stroke-width="2"/><rect x="156" y="68" width="48" height="6" rx="3" fill="#e9b56b"/>
    ${use('bear',148,18,64,70)}
  </g>
  <rect y="118" width="250" height="12" fill="#ffd9e6"/>
  ${['🌸','🌷','🌼','💗','🌸','🌷'].map((e,k)=>`<text x="${12+k*42}" y="128" font-size="13">${e}</text>`).join('')}
</svg>`;

/* Bouquet of pinwheel flowers */
(function(){
  const cols = ['#ff5c8a','#ffb347','#ffd34d','#a77bff','#ff7a45','#ff5c8a'];
  const pos = [[100,40,1.25],[52,62,1],[148,60,1],[78,22,.95],[124,24,.95],[28,90,.8],[172,90,.8]];
  let s = '', f = '';
  pos.forEach((p,k)=>{
    s += `<path class="stem" style="animation-delay:${k*.12}s" d="M100 150C100 120 ${p[0]} ${p[1]+50} ${p[0]} ${p[1]}"/>`;
    const c = cols[k%cols.length], c2 = cols[(k+2)%cols.length];
    let petals=''; for(let a=0;a<5;a++) petals += `<path d="M0 0C-13-6-14-24 0-28 7-18 7-7 0 0Z" fill="${a%2?c2:c}" opacity=".95" transform="rotate(${a*72})"/>`;
    f += `<g transform="translate(${p[0]} ${p[1]}) scale(${p[2]})"><g class="bloom" style="animation-delay:${1.1+k*.15}s"><g>${petals}<circle r="4" fill="#fff6d8"/></g></g></g>`;
  });
  $('#bouquet').innerHTML = `${s}${f}
    <path d="M62 150h76l-12 36H74z" fill="url(#gold)"/><path d="M62 150h76" stroke="#a96a0d" stroke-width="3" stroke-linecap="round"/>
    <defs><linearGradient id="gold" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f6c456"/><stop offset="1" stop-color="#c98312"/></linearGradient></defs>
    <use href="#heart" x="90" y="156" width="20" height="20" style="color:#fff"/>`;
})();

/* Typewriter letter (starts when page 3 opens) */
let startLetter;
(function(){
  $('#greet').textContent = CONFIG.greeting;
  const wrap = $('#paras'); const ps = CONFIG.letter.map(()=>{const p=document.createElement('p');wrap.appendChild(p);return p});
  $('#lfig').innerHTML = img(CONFIG.images.letter, scene(2,'hug','💤')); $('#sign').textContent = CONFIG.signature;
  let started=false, skip=false;
  const sleep = ms => new Promise(r=>setTimeout(r,ms));
  async function run(){
    for(let i=0;i<ps.length;i++){
      const t = CONFIG.letter[i]; ps[i].classList.add('caret');
      for(let k=0;k<=t.length && !skip;k++){ ps[i].textContent = t.slice(0,k); await sleep(reduce?0:22); }
      ps[i].textContent = t; ps[i].classList.remove('caret');
      if(i===0) $('#lfig').classList.add('on');
    }
    $('#lfig').classList.add('on'); $('#sign').classList.add('on'); $('#nav2').classList.add('on');
  }
  startLetter = () => { if(started) return; started=true; setTimeout(run,500); };
  $('#letter').addEventListener('click',()=>{skip=true});
})();

/* Moments (2 at a time) */
(function(){
  const M = CONFIG.moments; let i = 0;
  function render(){
    const a = M[i % M.length], b = M[(i+1) % M.length];
    $('#pair').innerHTML = [[a,i],[b,i+1]].map(([m,k])=>`<figure class="moment">${img(CONFIG.images.moments[k % M.length], scene(k,m[0],m[1]))}<p>${m[2]}</p></figure>`).join('');
    $('#mcount').textContent = `Moments ${(i%M.length)+1} & ${((i+1)%M.length)+1} of ${M.length} ❤️`;
  }
  $('#more').onclick = e => { i = (i+2) % M.length; render(); burst(e.clientX,e.clientY,10); };
  render();
})();

/* Reasons */
(function(){
  const R = CONFIG.reasons; let i = 0; const el = $('#reason'); el.textContent = R[0];
  $('#another').onclick = e => {
    el.classList.add('out');
    setTimeout(()=>{ let n; do{ n = Math.floor(Math.random()*R.length) }while(n===i && R.length>1); i=n; el.textContent=R[i]; el.classList.remove('out'); },220);
    burst(e.clientX,e.clientY,8);
  };
})();
$('#promises').innerHTML = CONFIG.promises.map(p=>`<li>${p}</li>`).join('');

/* Love meter */
(function(){
  const m = $('#meter'), bar = m.firstElementChild; let n = 0;
  $('#check').onclick = e => {
    if(n===0){ bar.style.width='0'; requestAnimationFrame(()=>requestAnimationFrame(()=>bar.style.width='100%')); }
    m.setAttribute('aria-valuenow',100); setTimeout(()=>m.classList.add('full'),n?0:2200);
    $('#mtext').textContent = CONFIG.meter[n % CONFIG.meter.length]; n++; setTimeout(()=>$('#nav6').classList.add('on'),n===1?2300:0);
    setTimeout(()=>burst(e.clientX,e.clientY,14),n===1?1800:0);
  };
})();

/* Finale */
$('#final').innerHTML = img(CONFIG.images.final, scene(1,'rose','🎁'));
let hugN = 0;
$('#hug').onclick = e => {
  burst(innerWidth/2, innerHeight*.55, 70);
  const t = $('#toast'); t.textContent = CONFIG.hugs[hugN++ % CONFIG.hugs.length]; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'),2600);
};

/* Particles: ambient hearts/sparkles + confetti bursts */
const cv = $('#fx'), cx = cv.getContext('2d'); let W,H,DPR;
function size(){ DPR=Math.min(devicePixelRatio||1,2); W=cv.width=innerWidth*DPR; H=cv.height=innerHeight*DPR; }
addEventListener('resize',size); size();
const P = [], PALETTE = ['#ff5c8a','#ffb347','#ffd34d','#a77bff','#5cc8ff','#ff8fb1','#7be0a8'];
function heart(x,y,s,c,a){ cx.save(); cx.translate(x,y); cx.scale(s,s); cx.globalAlpha=a; cx.fillStyle=c; cx.beginPath();
  cx.moveTo(0,.35); cx.bezierCurveTo(-1,-.4,-.5,-1,0,-.5); cx.bezierCurveTo(.5,-1,1,-.4,0,.35); cx.fill(); cx.restore(); }
function amb(){ return {t:'amb',x:Math.random()*W,y:H+20*DPR,vx:(Math.random()-.5)*.3*DPR,vy:-(.35+Math.random()*.6)*DPR,s:(7+Math.random()*10)*DPR,c:Math.random()<.7?'#ff7aa2':'#ffc0d4',a:.35+Math.random()*.3,ph:Math.random()*6,l:1} }
function burst(x,y,n){
  if(reduce) return; x*=DPR; y*=DPR;
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=(2+Math.random()*6)*DPR;
    P.push({t:Math.random()<.45?'h':'r',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2*DPR,s:(4+Math.random()*7)*DPR,c:PALETTE[i%PALETTE.length],a:1,r:Math.random()*6,vr:(Math.random()-.5)*.3,l:1,g:.14*DPR}); }
}
for(let i=0;i<14;i++){ const p=amb(); p.y=Math.random()*H; P.push(p); }
let last=0; (function loop(ts){
  cx.clearRect(0,0,W,H);
  if(!reduce && ts-last>650 && P.filter(p=>p.t==='amb').length<26){ P.push(amb()); last=ts; }
  for(let i=P.length-1;i>=0;i--){ const p=P[i];
    if(p.t==='amb'){ p.ph+=.02; p.x+=p.vx+Math.sin(p.ph)*.4*DPR; p.y+=p.vy; heart(p.x,p.y,p.s,p.c,p.a); if(p.y<-30*DPR) P.splice(i,1); }
    else { p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.vx*=.99; p.r+=p.vr; p.l-=.012; p.a=Math.max(p.l,0);
      if(p.t==='h') heart(p.x,p.y,p.s,p.c,p.a);
      else { cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.globalAlpha=p.a; cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); cx.restore(); }
      if(p.l<=0) P.splice(i,1); }
  }
  requestAnimationFrame(loop);
})(0);

/* Page flow */
const pages = [...document.querySelectorAll('.page')]; let idx = 0, busy = false;
const pd = $('#pdots'); pd.innerHTML = pages.slice(1).map(()=>'<i></i>').join('');
const enter = {
  1:()=>{ setTimeout(()=>burst(innerWidth/2,innerHeight*.3,100),350); setTimeout(()=>burst(innerWidth*.2,innerHeight*.25,45),800); setTimeout(()=>burst(innerWidth*.8,innerHeight*.25,45),1000); },
  2:()=>startLetter(),
  7:()=>{ setTimeout(()=>burst(innerWidth/2,innerHeight*.35,60),300); }
};
function paint(){
  [...pd.children].forEach((d,k)=>{ d.className = k+1===idx?'now':(k+1<idx?'done':''); });
  $('#topbar').classList.toggle('hide', idx===0); $('#back').style.visibility = idx>1?'visible':'hidden';
}
function go(n, replay){
  if(busy||n===idx||n<0||n>=pages.length) return; busy=true;
  const cur=pages[idx], nxt=pages[n], dir = n>idx?'f':'b';
  cur.dataset.dir=dir; nxt.dataset.dir=dir; cur.classList.add('leave');
  setTimeout(()=>{ cur.classList.remove('active','leave'); nxt.classList.add('active'); idx=n; scrollTo(0,0); paint(); busy=false; if(!replay||n===1) enter[n]&&enter[n](); },reduce?0:380);
}
document.querySelectorAll('[data-next]').forEach(b=>b.addEventListener('click',e=>{ burst(e.clientX,e.clientY,12); go(idx+1); }));
$('#back').onclick = () => go(idx-1,true);
$('#replay').onclick = () => go(1);
paint();
</script>
</body>
</html>
